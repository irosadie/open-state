services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${E2E_PG_PORT:-55437}:5432"
    environment:
      POSTGRES_DB: openstate_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openstate_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${E2E_REDIS_PORT:-56381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - e2e-redis-data:/data

volumes:
  e2e-postgres-data:
  e2e-redis-data:
