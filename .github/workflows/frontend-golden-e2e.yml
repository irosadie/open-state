name: Frontend Golden E2E

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "scripts/e2e/**"
      - "openspec/changes/frontend-golden-operator-e2e/**"
      - ".github/workflows/frontend-golden-e2e.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "scripts/e2e/**"
      - "openspec/changes/frontend-golden-operator-e2e/**"
      - ".github/workflows/frontend-golden-e2e.yml"
      - "package.json"
      - "bun.lock"

concurrency:
  group: frontend-golden-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-golden:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      E2E_FIXTURE_PASSWORD: openstate-e2e-fixture-password
      E2E_TEST_SECRET: openstate-e2e-only-secret-0123456789-abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3

      - name: Install Chromium
        run: bun --cwd apps/web exec playwright install --with-deps chromium

      - name: Run browser golden journeys
        id: e2e
        run: bun run test:e2e

      - name: Validate failure artifacts
        if: always()
        id: artifacts
        run: node scripts/e2e/validate-artifacts.mjs

      - name: Upload bounded synthetic diagnostics
        if: steps.e2e.outcome == 'failure' && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-golden-e2e-diagnostics
          path: apps/web/test-results/e2e
          if-no-files-found: ignore
          retention-days: 3
