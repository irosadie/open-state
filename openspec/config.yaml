schema: spec-driven

# Project context — shown to AI when creating OpenSpec artifacts.
context: |
  # OpenState
  Open-source enterprise **Conversation State Orchestration Platform**.

  ## Core principle
  > The LLM can suggest. The State Engine decides. The MCP executes.
  > The RAG informs. PostgreSQL remembers.
  The LLM is NEVER the source of truth for workflow state.

  ## Tech stack
  - Frontend: Next.js (App Router) + React Flow + Zustand + TanStack Query
  - Backend: Go (Echo) Clean Architecture + sqlc + goose + pgx
  - Worker: Go (asynq) + Redis
  - Monorepo: Turborepo + bun
  - Database: PostgreSQL (primary), repository abstraction for other adapters

  ## Architecture
  - Modular monolith (PRD 175) — 1 Go binary, clean internal boundaries
  - Domain / Application / Infrastructure / Interfaces
  - MCP server HTTP/SSE for LLM/RAG integration
  - LLM multi-provider abstraction

  ## Domain model
  - Workflow, State, Transition, Guard, Event, WorkflowInstance, StateInstance
  - IntentRegistry: conversation → intent → workflow → state
  - Capability Registry: logical capability → MCP provider
  - Context: tenant → conversation → workflow → state → turn

  ## Conventions
  - Conventional commits
  - Frontend lint: Biome (no any, no console.*)
  - Backend: go vet, idiomatic Go
  - Source of truth: MAIN_PRD.md

# Per-artifact rules (optional)
rules:
  proposal:
    - Keep proposals focused and reference PRD sections where relevant
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
